<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Directory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
<h1>Welcome to ADD PRODUCT CATALOG page</h1>
<hr>
This page can only be viewed ADMINS.</p>
<hr>
<div class="container">
    <h3> Employee Directory </h3>
    <hr>
<!--    <p class="h4 mb-4">Save Product </p>-->
    <form action="#" th:action="@{/save}"
          th:object="${product}" method="POST">
        <input type="hidden" th:field="*{id}" />
        <input type="text" th:field="*{productName}" class="form-control mb-4 w-25" placeholder="Product name" />
        <input type="text" th:field="*{category}" class="form-control mb-4 w-25" placeholder="Category" />
        <input type="text" th:field="*{price}" class="form-control mb-4 w-25" placeholder="Price" />
        <input type="text" th:field="*{status}" class="form-control mb-4 w-25" placeholder="Status" />
        <button th:href="@{/save(productId=${product})}"  type="submit" class="btn btn-info col-2">Save</button>

    </form>
    <hr>
    <a th:href="@{/viewCatalog}">Back to Product list</a>
</div>
<!--viewCatalog-->
<hr>
<!--<a th:href="@{/}">Back to Home Page</a>-->
</body>
</html>
