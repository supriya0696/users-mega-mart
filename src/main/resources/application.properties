spring.application.name=demosecurity
# JDBC Properties
spring.datasource.url=jdbc:mysql://localhost:3306/megamart_directory
spring.datasource.username=root
spring.datasource.password=root

#Log JDBC SQL ststements
#Only use this for dev/testing
#DO NOT use for PRODUCTION since it will log user names
logging.level.org.springframework.jdbc.core=TRACE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8081